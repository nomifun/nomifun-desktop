[package]
name = "nomifun-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nomifun-web"
path = "src/main.rs"

[features]
default = []
static-webui = []

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"

[dependencies]
# The unified backend, consumed in-process as a library (no spawned binary).
# The current product host uses nomifun_app's explicit Nomi-core bootstrap and
# mounts the same /api router as the desktop shell. Fresh-v4 remains a separate
# future host composition and is not selected by this binary.
nomifun-app.workspace = true
nomifun-common.workspace = true
nomifun-runtime.workspace = true

tokio.workspace = true
axum.workspace = true
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["fs", "trace"] }
tracing.workspace = true
anyhow.workspace = true
clap.workspace = true
