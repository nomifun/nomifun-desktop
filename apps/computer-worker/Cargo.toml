[package]
name = "nomifun-computer-worker"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "NomiFun private stdio worker for the vendored Cua Driver"

[workspace]
resolver = "3"

[dependencies]
anyhow = "1"
cua-driver-core = { path = "../../vendor/cua-driver/crates/cua-driver-core", default-features = false }
cua-driver-sdk = { path = "../../vendor/cua-driver/crates/cua-driver-sdk", default-features = false }
cursor-overlay = { path = "../../vendor/cua-driver/crates/cursor-overlay" }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
platform-macos = { path = "../../vendor/cua-driver/crates/platform-macos" }

[target.'cfg(target_os = "linux")'.dependencies]
cua-driver-sdk = { path = "../../vendor/cua-driver/crates/cua-driver-sdk", default-features = false, features = ["portal-input"] }
platform-linux = { path = "../../vendor/cua-driver/crates/platform-linux" }

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "2"

[target.'cfg(target_os = "windows")'.dependencies]
platform-windows = { path = "../../vendor/cua-driver/crates/platform-windows" }

# Native Wayland capture stays disabled until the S1 GNOME POC establishes D12.
# The worker always includes portal-input on Linux; it has no runtime switch.

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
