# Phase 1 local sales-automation sandbox.
#
# Start:
#   docker compose -f docker-compose.sales-local.yml up --build -d
# Smoke test:
#   node tools/sales-local/smoke.mjs
# Stop (preserve data):
#   docker compose -f docker-compose.sales-local.yml down

services:
  nomifun-sales:
    build:
      context: .
      target: sales-runtime
      args:
        BUN_IMAGE: ${BUN_IMAGE:-oven/bun:1}
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        RUST_IMAGE: ${RUST_IMAGE:-rust:1-slim-trixie}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-debian:trixie-slim}
        BUN_REGISTRY: ${BUN_REGISTRY:-}
        APT_MIRROR: ${APT_MIRROR:-}
        CARGO_REGISTRY_MIRROR: ${CARGO_REGISTRY_MIRROR:-}
        NOMIFUN_PRODUCT_MODE: sales
        NOMIFUN_WEB_FEATURES: sales-runtime
    image: nomifun-web:sales-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NOMIFUN_SALES_PORT:-8787}:8787"
    shm_size: "1gb"
    volumes:
      - nomifun-sales-data:/data
      # Repository-managed Phase 2 workflow. Mount only this skill so the rest
      # of /data/skills remains writable for user-created skills.
      - ./tools/sales-local/skills/sales-contact-operator:/data/skills/sales-contact-operator:ro
    environment:
      NOMIFUN_ADMIN_USERNAME: ${NOMIFUN_ADMIN_USERNAME:-admin}
      NOMIFUN_ADMIN_PASSWORD: ${NOMIFUN_ADMIN_PASSWORD:-phase1-local-admin-only}
      # Local-only deterministic default used by the smoke script. Override it
      # before sharing this stack or binding it beyond loopback.
      NOMIFUN_ACCESS_TOKEN: ${NOMIFUN_ACCESS_TOKEN:-4eb2616de4f7f5e9aa23dded0f8d38b24ccbdf54da0344e29bd9cd19a63b7391}
      NOMIFUN_CHROME_BINARY: /usr/lib/chromium/chromium
    depends_on:
      mock-contact-site:
        condition: service_healthy

  mock-contact-site:
    image: node:22-bookworm-slim
    restart: unless-stopped
    command: ["node", "/app/server.mjs"]
    init: true
    ports:
      - "127.0.0.1:${NOMIFUN_MOCK_CONTACT_PORT:-8088}:8080"
    volumes:
      - ./tools/sales-local/mock-contact-site:/app:ro
      - mock-contact-submissions:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nomifun-sales-data:
  mock-contact-submissions:
