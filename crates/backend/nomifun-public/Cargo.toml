[package]
name = "nomifun-public"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []

[dependencies]
# Canonical Remote MCP operations delegate to the single AgentSession
# authority. This crate does not own a second session store.
nomifun-agent-platform.workspace = true
nomifun-agent-contracts.workspace = true
nomifun-agent-session.workspace = true
nomifun-api-types.workspace = true
# Instance API token validation and installation-owner authentication.
nomifun-auth.workspace = true
nomifun-common.workspace = true
# rmcp's official axum-mountable Streamable-HTTP MCP server transport. NOTE:
# version is pinned to the lockfile-resolved 1.7 (nomifun-app declares "1.5" but
# the workspace unifies to 1.7); the streamable-http-server transport feature is
# OFF in nomifun-app and enabled only here.
rmcp = { version = "1.7", features = ["server", "transport-streamable-http-server", "schemars"] }
axum.workspace = true
tokio.workspace = true
futures.workspace = true
http-body-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
sysinfo.workspace = true
tower-http.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
