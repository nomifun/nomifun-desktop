[package]
name = "nomifun-ai-agent"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait.workspace = true
nomifun-auth.workspace = true
nomifun-common.workspace = true
nomifun-db.workspace = true
nomifun-runtime.workspace = true
nomi-process-runtime.workspace = true
nomifun-knowledge.workspace = true
nomifun-terminal.workspace = true
nomifun-api-types.workspace = true
nomifun-agent-contracts.workspace = true
nomifun-agent-kernel.workspace = true
nomifun-model-invoke.workspace = true
nomifun-agent-runtime.workspace = true
nomifun-engine-core.workspace = true
nomifun-chat-model-broker.workspace = true
nomifun-net.workspace = true
reqwest.workspace = true
axum.workspace = true
base64.workspace = true
image = { workspace = true, features = ["jpeg", "webp", "gif"] }
tokio.workspace = true
url.workspace = true
sha2.workspace = true
same-file.workspace = true
hex.workspace = true
dirs.workspace = true
regex.workspace = true
dashmap.workspace = true
futures.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tempfile.workspace = true
nomi-tools.workspace = true
nomi-types.workspace = true
nomi-protocol.workspace = true
nomi-config.workspace = true
nomi-mcp.workspace = true
nomi-skills.workspace = true
nomi-providers.workspace = true
nomi-redact.workspace = true
crossterm.workspace = true
is-terminal.workspace = true
# Native Workspace contracts and isolated local-search engine. Knowledge uses
# its own typed port; the legacy BrowserTool/Hub adapter is not a dependency.
nomifun-browser-platform = { workspace = true, optional = true }
nomi-browser-engine = { workspace = true, optional = true }
uuid.workspace = true
tokio-util = { version = "0.7", features = ["compat"] }
rusqlite.workspace = true
libc.workspace = true
ts-rs.workspace = true
zip.workspace = true
flate2.workspace = true
fs2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[features]
# Enables the `AgentRuntimeHandle::Mock` variant used by downstream test harnesses
# (conversation/cron/team/app) to inject trait-object stubs without having to
# spawn a real agent process. Production builds must NOT turn this on — it
# retains test-only no-op lifecycle behavior. The source-installed Runtime
# implements OfficialAgentRuntime and must provide result-bearing teardown.
test-support = []
# Desktop control tools for the nomi engine (desktop host only).
computer-use = []
# Browser-automation tools for the nomi engine (desktop host only).
browser-use = ["dep:nomifun-browser-platform", "dep:nomi-browser-engine"]

[dev-dependencies]
nomifun-agent-domain-wave1.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing-subscriber.workspace = true
nomifun-common.workspace = true
nomifun-creation.workspace = true
nomifun-db.workspace = true
nomifun-api-types.workspace = true
# E2E knowledge_search regression (knowledge_search_e2e): a local NoopBroadcaster
# implements nomifun_realtime::EventBroadcaster. The tool trait is now also a
# production dependency for the native image-generation tool wiring.
nomifun-realtime.workspace = true
wiremock.workspace = true
# Used by the acp_session_sync test setup to seed the conversations FK parent
# directly on the in-memory pool (mirrors nomifun-db's own acp_session tests).
sqlx = { workspace = true }
