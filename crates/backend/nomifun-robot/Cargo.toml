[package]
name = "nomifun-robot"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Exposes the mock service implementations to integration tests.
test-support = []

[dependencies]
nomifun-api-types = { workspace = true }
nomifun-realtime = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# Session ids are opaque and random. `v4` is additive on top of the workspace
# `v7` feature; naming it here keeps the crate compiling on its own rather than
# relying on workspace feature unification.
uuid = { workspace = true, features = ["v4"] }
# Statically linked vendored libopus (see the workspace entry for why this and
# not `audiopus`/`opus`); the FFI is wrapped in `src/audio/opus.rs`.
opusic-sys = { workspace = true }
symphonia = { workspace = true }
# Silero VAD (ONNX Runtime). Loading is fallible at runtime and every failure
# path degrades to the energy VAD, so this is never a hard requirement.
ort = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The MCP proxy is only correct if it is driven over real HTTP, headers and all.
reqwest = { workspace = true }
# `test-util` is not in tokio's `full`, and the downlink pacer's cadence tests
# need `start_paused` virtual time rather than real 60 ms sleeps.
tokio = { workspace = true, features = ["test-util"] }
# Drives the device router in-process (`oneshot`), so route tests exercise the
# real handlers and extractors instead of calling private functions.
tower = { workspace = true }
