[package]
name = "nomifun-browser-macos"
version.workspace = true
edition.workspace = true
license.workspace = true

# This native adapter is deliberately absent from the Windows dependency graph.
# Windows continues to use the desktop's existing WebView2 host.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSApplication", "NSMenu", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSControl", "NSButton", "NSEvent", "NSResponder", "NSView", "NSWindow", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSProgressIndicator"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKWebViewConfiguration", "WKPreferences", "WKWebsiteDataStore", "WKWebsiteDataRecord", "WKNavigation", "WKNavigationAction", "WKNavigationResponse", "WKNavigationDelegate", "WKUIDelegate", "WKFrameInfo", "WKSecurityOrigin", "WKContentWorld", "WKSnapshotConfiguration", "WKWindowFeatures", "WKOpenPanelParameters", "WKDownload", "WKDownloadDelegate"] }
block2 = "0.6"
dispatch2 = "0.3"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
nomifun-browser-platform.workspace = true
url.workspace = true
uuid.workspace = true
