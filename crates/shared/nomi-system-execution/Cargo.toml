[package]
name = "nomi-system-execution"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
nomi-process-runtime.workspace = true
nomi-native-files.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO",
  "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_Shell",
  "Win32_System_Registry", "Win32_System_RemoteDesktop",
  "Win32_UI_WindowsAndMessaging",
] }
