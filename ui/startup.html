<!doctype html>
<html data-theme="light" data-color-scheme="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NomiFun</title>
    <style>html, body, #root { height: 100%; width: 100%; margin: 0; overflow: hidden; }</style>
    <script>
      try {
        var theme = localStorage.getItem('__nomifun_theme');
        if (theme) document.documentElement.setAttribute('data-theme', theme);
        var scheme = localStorage.getItem('__nomifun_colorScheme');
        if (scheme) document.documentElement.setAttribute('data-color-scheme', scheme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/startup.tsx"></script>
  </body>
</html>
